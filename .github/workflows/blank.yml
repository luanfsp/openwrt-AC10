# This is a basic workflow to help you get started with Actions
name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "openwrt-18.06-rtkmipsel-3.18" branch
  push:
    branches: [ "openwrt-18.06-rtkmipsel-3.18" ]
  pull_request:
    branches: [ "openwrt-18.06-rtkmipsel-3.18" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install apt dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            bzip2 \
            bison \
            flex \
            python3 \
            python3-distutils \
            perl \
            make \
            findutils \
            grep \
            diffutils \
            unzip \
            gawk \
            util-linux \
            subversion \
            git \
            rsync \
            ccache \
            zlib1g-dev \
            libc6-dev \
            libncurses5-dev \
            libssl-dev \
            gettext \
            file

      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure non-interactively and build
        run: |
          # do not run make menuconfig in CI (interactive). Use defconfig or provide a .config in the repo.
          make defconfig
          make -j$(nproc)
