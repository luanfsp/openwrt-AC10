# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "openwrt-18.06-rtkmipsel-3.18" branch
  push:
    branches: [ "openwrt-18.06-rtkmipsel-3.18" ]
  pull_request:
    branches: [ "openwrt-18.06-rtkmipsel-3.18" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

     # .github/workflows/blank.yml (replace the current one-line "Run a one-line script" step)
- name: Install apt dependencies
  run: |
    sudo apt-get update -y
    sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
      build-essential \
      binutils \
      bzip2 \
      bison \
      flex \
      python3 \
      python3-distutils \
      perl \
      make \
      findutils \
      grep \
      diffutils \
      unzip \
      gawk \
      util-linux \
      subversion \
      git \
      rsync \
      ccache \
      zlib1g-dev \
      libc6-dev \
      libncurses5-dev \
      libssl-dev \
      gettext \
      file
- name: Checkout repository (actions/checkout already used above)
  uses: actions/checkout@v4

- name: Prepare feeds
  run: |
    ./scripts/feeds update -a
    ./scripts/feeds install -a

- name: Configure non-interactively and build
  run: |
    # do not run make menuconfig in CI (interactive). Use defconfig or provide a .config in the repo.
    make defconfig
    make -j$(nproc)
